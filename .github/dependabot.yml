version: 2
updates:
  - package-ecosystem: npm
    directory: /v1
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR for the routine noise; anything major still arrives on its own.
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Actions are pinned to commit SHAs (see ci.yml); Dependabot updates the SHA and the
    # trailing version comment together, which is the only maintainable way to stay pinned.
