name: CI

# Every push and every pull request. This is the gate the branch-protection rule requires
# (D-005 — the repo is public specifically so that rule is available on the free plan).
#
# Actions are pinned to commit SHAs, not tags: a tag is mutable, so `@v5` is an instruction
# to run whatever that repository decides `v5` means on the day the workflow runs.
# Permissions are read-only by default and raised per job only where needed.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: v1

jobs:
  verify:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: v1/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (JS/TS)
        run: npm run lint

      - name: Lint (CSS token enforcement)
        # A design-token rule without its check is decoration. This fails on any raw
        # colour or size value outside tokens.css.
        run: npm run lint:css

      - name: Tests
        # Includes the deck round-trip against v0's facts.js, the deck statistical
        # ratchet (R1), and the 60-day scheduler simulation with invariant assertions (R4).
        run: npm test

      - name: Build
        run: npm run build

  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  v0-untouched:
    name: v0 is untouched
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Refuse any change to the deployed v0
        # v0 stays deployed and in daily use for the whole build, and the entire
        # "the exam deadline is neutralised" arrangement depends on it staying alive
        # and identical (D-001, D-006, D-020). A written rule would decay; this won't.
        run: |
          base='${{ github.event.pull_request.base.sha || github.event.before }}'
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "No base commit to diff against — first push. Skipping."
            exit 0
          fi
          changed=$(git diff --name-only "$base" HEAD -- index.html facts.js README.md)
          if [ -n "$changed" ]; then
            echo "::error::v0 files modified: $changed"
            echo "v0 is reference, not a base to build on. See DECISIONS D-001 and D-020."
            exit 1
          fi
          echo "v0 untouched."
