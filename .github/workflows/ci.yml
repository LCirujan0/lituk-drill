name: CI

# Every push and every pull request. This is the gate the branch-protection rule requires
# (D-005 — the repo is public specifically so that rule is available on the free plan).
#
# Actions are pinned to commit SHAs, not tags: a tag is mutable, so `@v5` is an instruction
# to run whatever that repository decides `v5` means on the day the workflow runs.
# Permissions are read-only by default and raised per job only where needed.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (JS/TS)
        run: npm run lint

      - name: Lint (CSS token enforcement)
        # A design-token rule without its check is decoration. This fails on any raw
        # colour or size value outside tokens.css.
        run: npm run lint:css

      - name: Tests
        # Includes the deck's structural and statistical ratchet, the scheduler invariants,
        # and the 60-day simulation over simulated time.
        run: npm test

      - name: Build
        run: npm run build

  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
